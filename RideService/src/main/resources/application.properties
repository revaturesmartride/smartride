        spring.cloud.config.enabled=false

        nominatim.base-url=https://nominatim.openstreetmap.org
        osrm.base-url=https://router.project-osrm.org
        userservice.url=http://localhost:8081





        # ???????????????????????????????????????????????????????????????????????????????
        # RESILIENCE4J ? Circuit Breaker, Retry, TimeLimiter
        # Spring Boot auto-wires these to @CircuitBreaker/@Retry/@TimeLimiter annotations
        # No ResilienceConfig.java class needed at all.
        # ???????????????????????????????????????????????????????????????????????????????

        # ?? Circuit Breaker ???????????????????????????????????????????????????????????

        # nominatim
        resilience4j.circuitbreaker.instances.nominatim.sliding-window-size=10
        resilience4j.circuitbreaker.instances.nominatim.failure-rate-threshold=50
        resilience4j.circuitbreaker.instances.nominatim.wait-duration-in-open-state=10s
        resilience4j.circuitbreaker.instances.nominatim.permitted-number-of-calls-in-half-open-state=3
        resilience4j.circuitbreaker.instances.nominatim.slow-call-duration-threshold=3s

        # osrm
        resilience4j.circuitbreaker.instances.osrm.sliding-window-size=10
        resilience4j.circuitbreaker.instances.osrm.failure-rate-threshold=50
        resilience4j.circuitbreaker.instances.osrm.wait-duration-in-open-state=10s
        resilience4j.circuitbreaker.instances.osrm.permitted-number-of-calls-in-half-open-state=3
        resilience4j.circuitbreaker.instances.osrm.slow-call-duration-threshold=3s

        # userService
        resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
        resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
        resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=15s
        resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
        resilience4j.circuitbreaker.instances.userService.slow-call-duration-threshold=3s

        # ?? Retry ?????????????????????????????????????????????????????????????????????

        # nominatim
        resilience4j.retry.instances.nominatim.max-attempts=3
        resilience4j.retry.instances.nominatim.wait-duration=500ms

        # osrm
        resilience4j.retry.instances.osrm.max-attempts=3
        resilience4j.retry.instances.osrm.wait-duration=500ms

        # userService
        resilience4j.retry.instances.userService.max-attempts=4
        resilience4j.retry.instances.userService.wait-duration=300ms

        # ?? Time Limiter ??????????????????????????????????????????????????????????????

        # nominatim ? public OSM server can be slow
        resilience4j.timelimiter.instances.nominatim.timeout-duration=5s

        # osrm ? routing is compute-heavy
        resilience4j.timelimiter.instances.osrm.timeout-duration=5s

        # userService ? internal service, should be fast
        resilience4j.timelimiter.instances.userService.timeout-duration=3s