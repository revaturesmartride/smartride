spring.application.name=RideService
spring.datasource.url=jdbc:mysql://localhost:3306/smart_ride
spring.datasource.username=root
spring.datasource.password=gopikarthik@2003

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ??? Kafka Bootstrap ??????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092

# ??? Kafka Producer ???????????????????????????????????????????????????????????
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# ??? Kafka Topics ?????????????????????????????????????????????????????????????
kafka.topics.ride-created=ride-created
kafka.topics.ride-assigned=ride-assigned
kafka.topics.ride-started=ride-started
kafka.topics.ride-completed=ride-completed
kafka.topics.payment-completed=payment-completed
kafka.topics.ride-rated=ride-rated

