spring.application.name=API-GATEWAY
server.port=8080

# ?? Eureka ????????????????????????????????????????????????????????????????????
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ?? JWT (same secret as UserService JwtTokenProvider) ????????????????????????
jwt.secret=smartride-secret-key-smartride-secret-key

# ?? UserService base URL ??????????????????????????????????????????????????????
userservice.url=http://USER-SERVICE

# ?? Routes ????????????????????????????????????????????????????????????????????
# lb://SERVICE-NAME ? Eureka load balanced
# JwtAuthFilter     ? applied to all protected routes

# 1. Auth routes ? PUBLIC (no JWT required)
spring.cloud.gateway.routes[0].id=user-service-public
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 2. UserService ? protected
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthFilter

# 3. RideService
spring.cloud.gateway.routes[2].id=ride-service
spring.cloud.gateway.routes[2].uri=lb://RIDE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rides/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthFilter

# 4. PaymentService (inside RideService module)
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://RIDE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthFilter

# 5. RatingService (inside RideService module)
spring.cloud.gateway.routes[4].id=rating-service
spring.cloud.gateway.routes[4].uri=lb://RIDE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/ratings/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthFilter

# ?? Logging ???????????????????????????????????????????????????????????????????
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.revature.apigateway=DEBUG